name: Migrate staging database

on:
  push:
    branches: [ "main" ]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run migrations worker
        env:
          ConnectionStrings__postgresdb: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: dotnet run --project apps/migrations/Migrations.csproj --configuration Release
